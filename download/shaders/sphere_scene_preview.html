<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>sphere_scene.frag — preview</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud {
    position: absolute; top: 8px; left: 8px;
    color: #6f6; font: 12px monospace;
    background: rgba(0,0,0,0.85); padding: 8px 12px; border-radius: 4px;
    max-width: 90vw; max-height: 90vh; overflow: auto; white-space: pre-wrap;
  }
  .hud.err { color: #f66; }
  .hud.ok  { color: #6f6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud">init…</div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;

out vec4 FragColor;

uniform float uTime;
uniform float uClipTime;
uniform float uProgress;
uniform float uGlobalTime;
uniform vec2  uResolution;
uniform int   uSeed;
uniform float uBeat;
uniform float uBeatPhase;
uniform float uBarPhase;
uniform float uEnergy;

uniform vec3  uColor;
uniform float uGlow;
uniform float uOrbit;

const float PI  = 3.14159265359;
const float TAU = 6.28318530718;

float safeDiv(float a, float b) { return b != 0.0 ? a / b : 0.0; }

// LCG с uint — precision highp int; выше обязателен для uint операций.
float rng(float n) {
    uint i = floatBitsToUint(n) ^ (uint(uSeed) * 0x9E3779B1u);
    i ^= i >> 16u; i *= 0x85ebca6bu;
    i ^= i >> 13u; i *= 0xc2b2ae35u;
    i ^= i >> 16u;
    return float(i) * (1.0 / 4294967296.0);
}

float sdSphere(vec3 p, float r) { return length(p) - r; }

float smin(float a, float b, float k) {
    float kk = max(k, 0.005);
    float h = clamp(0.5 + 0.5 * (b - a) / kk, 0.0, 1.0);
    return mix(b, a, h) - kk * h * (1.0 - h);
}

vec3 gOrbitPos0; vec3 gOrbitPos1; vec3 gOrbitPos2; vec3 gOrbitPos3;
float gOrbitRad0; float gOrbitRad1; float gOrbitRad2; float gOrbitRad3;

float mapScene(vec3 p) {
    float beatPulse = 1.0 + 0.05 * pow(1.0 - uBeatPhase, 4.0);
    float dMain = sdSphere(p, beatPulse);
    float d0 = sdSphere(p - gOrbitPos0, gOrbitRad0);
    float d1 = sdSphere(p - gOrbitPos1, gOrbitRad1);
    float d2 = sdSphere(p - gOrbitPos2, gOrbitRad2);
    float d3 = sdSphere(p - gOrbitPos3, gOrbitRad3);
    float dOrbit = min(min(d0, d1), min(d2, d3));
    return smin(dMain, dOrbit, 0.15);
}

vec3 calcNormal(vec3 p) {
    const vec2 k = vec2(1.0, -1.0);
    const float e = 0.001;
    return normalize(
        k.xyy * mapScene(p + k.xyy * e) +
        k.yyx * mapScene(p + k.yyx * e) +
        k.yxy * mapScene(p + k.yxy * e) +
        k.xxx * mapScene(p + k.xxx * e)
    );
}

vec2 rayMarch(vec3 ro, vec3 rd) {
    // Bounding sphere check — сцена внутри сферы R=4 вокруг центра.
    // Если луч мимо — сразу miss, без 32 шагов raymarch.
    vec3 oc = ro;  // центр сцены в (0,0,0)
    float b = dot(oc, rd);
    float c = dot(oc, oc) - 16.0;  // R*R = 16
    float disc = b * b - c;
    if (disc < 0.0) return vec2(-1.0, 0.0);  // miss bounding sphere
    // Начать raymarch с ближайшего пересечения bounding sphere.
    float tStart = max(0.0, -b - sqrt(disc));

    float t = tStart;
    const int STEPS = 32;        // 32 достаточно для гладких сфер (vs 48)
    const float MAX_DIST = 30.0;
    for (int i = 0; i < STEPS; i++) {
        vec3 p = ro + rd * t;
        float d = mapScene(p);
        if (d < 0.001) return vec2(t, 1.0);
        if (t > MAX_DIST) break;
        t += d;
    }
    return vec2(-1.0, 0.0);
}

vec3 lightDir() {
    float a = uOrbit * 0.7;
    return normalize(vec3(sin(a), 0.7, cos(a)));
}

vec3 backgroundColor(vec3 rd) {
    float t = 0.5 + 0.5 * rd.y;
    vec3 base = mix(vec3(0.02, 0.02, 0.04), vec3(0.08, 0.10, 0.14), t);
    return base + uColor * 0.05 * (1.0 - t);
}

vec3 aces(vec3 c) {
    return (c * (2.51 * c + 0.03)) / (c * (2.43 * c + 0.59) + 0.14);
}

void main() {
    vec2 fragUv = gl_FragCoord.xy / uResolution;
    vec2 uv = (fragUv * 2.0 - 1.0) * vec2(uResolution.x / uResolution.y, 1.0);

    // 4 орбитальные сферы — раскрыл цикл (более совместимо со старыми драйверами).
    float r0 = 1.5 + 1.0 * rng(0.0 * 1.7 + 0.3);
    float r1 = 1.5 + 1.0 * rng(1.0 * 1.7 + 0.3);
    float r2 = 1.5 + 1.0 * rng(2.0 * 1.7 + 0.3);
    float r3 = 1.5 + 1.0 * rng(3.0 * 1.7 + 0.3);
    float i0 = PI * rng(0.0 * 2.3 + 1.1);
    float i1 = PI * rng(1.0 * 2.3 + 1.1);
    float i2 = PI * rng(2.0 * 2.3 + 1.1);
    float i3 = PI * rng(3.0 * 2.3 + 1.1);
    float p0 = TAU * rng(0.0 * 3.1 + 2.7);
    float p1 = TAU * rng(1.0 * 3.1 + 2.7);
    float p2 = TAU * rng(2.0 * 3.1 + 2.7);
    float p3 = TAU * rng(3.0 * 3.1 + 2.7);
    float s0 = 0.15 + 0.15 * rng(0.0 * 4.5 + 3.3);
    float s1 = 0.15 + 0.15 * rng(1.0 * 4.5 + 3.3);
    float s2 = 0.15 + 0.15 * rng(2.0 * 4.5 + 3.3);
    float s3 = 0.15 + 0.15 * rng(3.0 * 4.5 + 3.3);

    float a0 = uOrbit + p0;
    float a1 = uOrbit + p1;
    float a2 = uOrbit + p2;
    float a3 = uOrbit + p3;

    gOrbitPos0 = vec3(cos(a0) * r0, sin(a0) * r0 * sin(i0), sin(a0) * r0 * cos(i0));
    gOrbitPos1 = vec3(cos(a1) * r1, sin(a1) * r1 * sin(i1), sin(a1) * r1 * cos(i1));
    gOrbitPos2 = vec3(cos(a2) * r2, sin(a2) * r2 * sin(i2), sin(a2) * r2 * cos(i2));
    gOrbitPos3 = vec3(cos(a3) * r3, sin(a3) * r3 * sin(i3), sin(a3) * r3 * cos(i3));
    gOrbitRad0 = s0; gOrbitRad1 = s1; gOrbitRad2 = s2; gOrbitRad3 = s3;

    float cam_t = uTime * 0.2;
    vec3 ro = vec3(sin(cam_t) * 4.0, 1.5, cos(cam_t) * 4.0);
    vec3 ta = vec3(0.0);
    vec3 fwd = normalize(ta - ro);
    vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), fwd));
    vec3 up = cross(fwd, right);
    vec3 rd = normalize(fwd + uv.x * right + uv.y * up);

    vec3 bg = backgroundColor(rd);
    vec2 hit = rayMarch(ro, rd);
    vec3 col;
    if (hit.x < 0.0) {
        col = bg;
    } else {
        vec3 p = ro + rd * hit.x;
        vec3 n = calcNormal(p);
        vec3 ld = lightDir();
        float diff = max(dot(n, ld), 0.0);
        float amb = 0.15 + 0.15 * max(dot(n, vec3(0.0, 1.0, 0.0)), 0.0);
        vec3 viewDir = -rd;
        vec3 halfDir = normalize(ld + viewDir);
        float spec = pow(max(dot(n, halfDir), 0.0), 32.0);
        vec3 surfColor = uColor * (0.9 + 0.1 * sin(p.y * 4.0 + uTime));

        float d0 = length(p - gOrbitPos0);
        float d1 = length(p - gOrbitPos1);
        float d2 = length(p - gOrbitPos2);
        float d3 = length(p - gOrbitPos3);
        float near0 = 1.0 - smoothstep(gOrbitRad0, gOrbitRad0 + 0.3, d0);
        float near1 = 1.0 - smoothstep(gOrbitRad1, gOrbitRad1 + 0.3, d1);
        float near2 = 1.0 - smoothstep(gOrbitRad2, gOrbitRad2 + 0.3, d2);
        float near3 = 1.0 - smoothstep(gOrbitRad3, gOrbitRad3 + 0.3, d3);
        float glowBoost = clamp((near0 + near1 + near2 + near3) * uGlow, 0.0, 2.0);

        vec3 surface = surfColor * (amb + diff * 0.8) + vec3(1.0) * spec * 0.5;
        surface += surfColor * glowBoost * 0.4;
        float fog = 1.0 - exp(-hit.x * 0.08);
        col = mix(surface, bg, fog * 0.5);
    }

    vec2 vd = fragUv - 0.5;
    col *= 1.0 - 0.3 * dot(vd, vd) * 2.0;
    col = aces(col);
    col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));
    FragColor = vec4(col, 1.0);
}
</script>

<script>
(function () {
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const log = [];
    function setHud(cls, msg) {
        hud.className = 'hud ' + cls;
        hud.textContent = msg;
    }
    function push(msg) {
        log.push(msg);
        setHud('', log.join('\n'));
    }

    try {
        push('step 1: get webgl2 context…');
        const gl = canvas.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
        if (!gl) {
            setHud('err', 'ERROR: WebGL2 не поддерживается этим браузером.\nПопробуйте Chrome/Edge/Firefox последней версии.');
            return;
        }
        push('step 2: webgl2 OK, version=' + gl.getParameter(gl.VERSION));
        push('step 3: renderer=' + gl.getParameter(gl.RENDERER).substring(0, 60));

        function compile(type, src, name) {
            const sh = gl.createShader(type);
            gl.shaderSource(sh, src);
            gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
                const info = gl.getShaderInfoLog(sh);
                setHud('err', 'SHADER ERROR [' + name + ']:\n' + info);
                throw new Error('compile ' + name);
            }
            return sh;
        }

        // Trim shader source (на случай leading whitespace из script tag)
        const vsSrc = document.getElementById('vs').textContent.trim();
        const fsSrc = document.getElementById('fs').textContent.trim();

        push('step 4: compile vertex shader…');
        const vs = compile(gl.VERTEX_SHADER, vsSrc, 'vertex');
        push('step 5: compile fragment shader (' + fsSrc.length + ' bytes)…');
        const fs = compile(gl.FRAGMENT_SHADER, fsSrc, 'fragment');

        push('step 6: link program…');
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
            setHud('err', 'LINK ERROR:\n' + gl.getProgramInfoLog(prog));
            return;
        }
        gl.useProgram(prog);
        push('step 7: program linked OK');

        // Fullscreen quad
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(prog, 'aPos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        // Uniform locations
        const U = {};
        ['uTime','uClipTime','uProgress','uGlobalTime','uResolution','uSeed',
         'uBeat','uBeatPhase','uBarPhase','uEnergy','uColor','uGlow','uOrbit']
            .forEach(name => U[name] = gl.getUniformLocation(prog, name));

        const test = {
            uColor: [0.10, 0.40, 0.80],
            uGlow: 1.2,
            uSeed: 2026,
        };

        function resize() {
            // DPR cap = 1: на HiDPI (Retina) не рендерим 4× пикселей —
            // для raymarch это критично, FPS падает в 4× без визуальной выгоды.
            const dpr = 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        let mouseRotY = 0, dragging = false, lastX = 0;
        canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; });
        window.addEventListener('mouseup', () => dragging = false);
        window.addEventListener('mousemove', e => {
            if (!dragging) return;
            mouseRotY += (e.clientX - lastX) * 0.005;
            lastX = e.clientX;
        });

        const start = performance.now();
        // FPS counter fix: dt меряем между КАЖДЫМ кадром, не между 30-ми.
        let lastFrameT = 0;
        let frameCount = 0;
        let fpsSmooth = 0;  // EMA для стабильного отображения
        function frame() {
            const T = (performance.now() - start) / 1000;
            const dt = lastFrameT > 0 ? (T - lastFrameT) : 0.016;
            lastFrameT = T;
            const instantFps = 1.0 / dt;
            // Exponential moving average — стабильное число, не прыгающее каждый кадр.
            fpsSmooth = fpsSmooth > 0 ? fpsSmooth * 0.9 + instantFps * 0.1 : instantFps;

            const beat = T * 2.0;
            const beatPhase = beat - Math.floor(beat);
            const barPhase = (beat / 4) - Math.floor(beat / 4);
            const orbit = (T * 0.3) % 6.28318530718;

            gl.uniform1f(U.uTime, T);
            gl.uniform1f(U.uClipTime, T);
            gl.uniform1f(U.uProgress, Math.min(T / 5, 1));
            gl.uniform1f(U.uGlobalTime, T);
            gl.uniform2f(U.uResolution, canvas.width, canvas.height);
            gl.uniform1i(U.uSeed, test.uSeed);
            gl.uniform1f(U.uBeat, beat);
            gl.uniform1f(U.uBeatPhase, beatPhase);
            gl.uniform1f(U.uBarPhase, barPhase);
            gl.uniform1f(U.uEnergy, 0.5 + 0.4 * Math.sin(T * 0.5));
            gl.uniform3fv(U.uColor, test.uColor);
            gl.uniform1f(U.uGlow, test.uGlow);
            gl.uniform1f(U.uOrbit, orbit + mouseRotY);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            frameCount++;
            // Обновляем HUD каждые 15 кадров (~4 раза/сек при 60fps), но FPS
            // считается из реального dt одного кадра.
            if (frameCount % 15 === 0) {
                setHud('ok', '✅ rendering OK  |  T=' + T.toFixed(1) + 's' +
                       '  |  orbit=' + orbit.toFixed(2) +
                       '  |  glow=' + test.uGlow.toFixed(2) +
                       '  |  FPS=' + fpsSmooth.toFixed(0) +
                       '  |  res=' + canvas.width + 'x' + canvas.height +
                       '  |  drag to rotate');
            }
            requestAnimationFrame(frame);
        }
        push('step 8: starting render loop…');
        frame();
    } catch (e) {
        setHud('err', 'EXCEPTION:\n' + (e && e.message ? e.message : String(e)) + '\n\nLog:\n' + log.join('\n'));
        console.error(e);
    }
})();
</script>
</body>
</html>
