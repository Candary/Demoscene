<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>anxiety_mist.frag — preview</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud {
    position: absolute; top: 8px; left: 8px;
    color: #6f6; font: 12px monospace;
    background: rgba(0,0,0,0.85); padding: 8px 12px; border-radius: 4px;
    max-width: 95vw; white-space: pre-wrap;
  }
  .hud.err { color: #f66; }
  .hud.ok  { color: #6f6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud">init…</div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;

out vec4 FragColor;

uniform float uTime;
uniform float uClipTime;
uniform float uProgress;
uniform float uGlobalTime;
uniform vec2  uResolution;
uniform int   uSeed;
uniform float uBeat;
uniform float uBeatPhase;
uniform float uBarPhase;
uniform float uEnergy;

uniform vec3  uPrimaryColor;
uniform vec3  uAccentColor;
uniform float uIntensity;
uniform float uMotionSpeed;
uniform float uWarmth;

const float PI  = 3.14159265359;
const float TAU = 6.28318530718;

float hash3(vec3 p) {
    p = fract(p * 0.3183099 + 0.1) + float(uSeed) * 0.0001;
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise3(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float na = hash3(i + vec3(0,0,0));
    float nb = hash3(i + vec3(1,0,0));
    float nc = hash3(i + vec3(0,1,0));
    float nd = hash3(i + vec3(1,1,0));
    float ne = hash3(i + vec3(0,0,1));
    float nf = hash3(i + vec3(1,0,1));
    float ng = hash3(i + vec3(0,1,1));
    float nh = hash3(i + vec3(1,1,1));
    return mix(mix(mix(na, nb, f.x), mix(nc, nd, f.x), f.y),
               mix(mix(ne, nf, f.x), mix(ng, nh, f.x), f.y), f.z);
}

// Unrolled FBM — 4 octaves, spectral weight 0.5.
float fbm(vec3 p) {
    float v = 0.0;
    v += 0.5 * noise3(p);
    p = p * 2.0 + vec3(1.7, 2.3, 3.1);
    v += 0.25 * noise3(p);
    p = p * 2.0 + vec3(1.7, 2.3, 3.1);
    v += 0.125 * noise3(p);
    p = p * 2.0 + vec3(1.7, 2.3, 3.1);
    v += 0.0625 * noise3(p);
    return v;
}

float beatFlash() {
    return pow(1.0 - uBeatPhase, 6.0);
}

float panicFlash() {
    float t = uTime;
    float period = 3.0 + 2.0 * fract(float(uSeed) * 0.137);
    float phase = mod(t, period) / period;
    // Avoid early return — ANGLE/D3D11 на старых GPU может ломаться.
    // 'active' — reserved word в GLSL, используем 'flashMask'.
    float flashMask = step(phase, 0.7);
    float localPhase = phase / 0.7;
    return pow(1.0 - localPhase, 3.0) * 0.8 * flashMask;
}

float totalFlash() {
    return clamp(beatFlash() * 0.5 + panicFlash(), 0.0, 1.5);
}

void main() {
    vec2 fragUv = gl_FragCoord.xy / uResolution;
    vec2 uv = fragUv * 2.0 - 1.0;
    uv.x *= uResolution.x / uResolution.y;

    float t = uTime * uMotionSpeed * 0.3;
    // Явные компоненты вместо vec3(vec2, float) — для совместимости со старыми ANGLE.
    vec3 p = vec3(uv.x * 1.5, uv.y * 1.5, t);

    float warp = fbm(p + vec3(5.2, 1.3, 0.0));
    // Domain warp: смещение по x,y на 2*warp, z (time) — без изменений.
    // (предыдущая версия vec3(2.0*warp, 0.0) имела только 2 компонента — compile error)
    float mist = fbm(p + vec3(2.0 * warp, 2.0 * warp, 0.0));

    vec3 darkBase = vec3(0.04, 0.03, 0.06);
    vec3 primaryMod = mix(
        uPrimaryColor * vec3(0.7, 0.3, 1.0),
        uPrimaryColor * vec3(1.3, 0.5, 0.3),
        uWarmth
    );

    vec3 col = darkBase;
    col = mix(col, primaryMod * 0.4, smoothstep(0.3, 0.7, mist));

    float flash = totalFlash();
    float flashMask = smoothstep(0.4, 0.8, mist);
    vec3 flashColor = uAccentColor * flash * flashMask * uIntensity;
    col += flashColor * 1.5;

    vec2 vd = fragUv - 0.5;
    float vig = 1.0 - 0.6 * dot(vd, vd) * 2.0;
    col *= vig;

    float shake = (noise3(vec3(t * 8.0, 0.0, 0.0)) - 0.5) * 0.005 * uIntensity;
    col *= 1.0 + shake * 2.0;

    col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);
    col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));

    FragColor = vec4(col, 1.0);
}
</script>

<script>
(function () {
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const log = [];
    function setHud(cls, msg) { hud.className = 'hud ' + cls; hud.textContent = msg; }
    function push(msg) { log.push(msg); setHud('', log.join('\n')); }

    try {
        push('step 1: get webgl2 context…');
        const gl = canvas.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
        if (!gl) { setHud('err', 'ERROR: WebGL2 не поддерживается.'); return; }
        push('step 2: ' + gl.getParameter(gl.VERSION));
        push('step 3: renderer=' + gl.getParameter(gl.RENDERER).substring(0, 60));

        let lastShaderError = '';
        function compile(type, src, name) {
            const sh = gl.createShader(type);
            gl.shaderSource(sh, src.trim());
            gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
                lastShaderError = gl.getShaderInfoLog(sh) || '(empty info log)';
                // НЕ перезаписываем throw — просто return null.
                // HUD покажет полную ошибку ниже.
                return null;
            }
            return sh;
        }

        const vsSrc = document.getElementById('vs').textContent;
        const fsSrc = document.getElementById('fs').textContent;
        push('step 4: compile vertex shader (' + vsSrc.length + ' bytes)…');
        const vs = compile(gl.VERTEX_SHADER, vsSrc, 'vertex');
        if (!vs) {
            setHud('err', 'VERTEX SHADER COMPILE FAILED:\n' + lastShaderError + '\n\nLog:\n' + log.join('\n'));
            return;
        }
        push('step 5: compile fragment shader (' + fsSrc.length + ' bytes)…');
        const fs = compile(gl.FRAGMENT_SHADER, fsSrc, 'fragment');
        if (!fs) {
            setHud('err', 'FRAGMENT SHADER COMPILE FAILED:\n' + lastShaderError + '\n\nLog:\n' + log.join('\n'));
            return;
        }

        push('step 6: link program…');
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
            setHud('err', 'LINK ERROR:\n' + gl.getProgramInfoLog(prog));
            return;
        }
        gl.useProgram(prog);
        push('step 7: program linked OK');

        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(prog, 'aPos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        const U = {};
        ['uTime','uClipTime','uProgress','uGlobalTime','uResolution','uSeed',
         'uBeat','uBeatPhase','uBarPhase','uEnergy',
         'uPrimaryColor','uAccentColor','uIntensity','uMotionSpeed','uWarmth']
            .forEach(name => U[name] = gl.getUniformLocation(prog, name));

        // Anxiety palette: тёмный красный primary + красный акцент.
        // (Это пример — реальный цвет приходит от palette.primary/accent в Scene Manager.)
        const test = {
            uPrimaryColor: [0.30, 0.05, 0.10],   // dark crimson
            uAccentColor:  [0.95, 0.10, 0.05],   // bright red flash
            uSeed: 2026,
        };

        function resize() {
            // DPR cap = 1. На HiDPI без cap FPS падает в 4×.
            const dpr = 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        const start = performance.now();
        let lastFrameT = 0, frameCount = 0, fpsSmooth = 0;
        function frame() {
            const T = (performance.now() - start) / 1000;
            const dt = lastFrameT > 0 ? (T - lastFrameT) : 0.016;
            lastFrameT = T;
            const instantFps = 1.0 / dt;
            fpsSmooth = fpsSmooth > 0 ? fpsSmooth * 0.9 + instantFps * 0.1 : instantFps;

            const beat = T * 2.0;
            const beatPhase = beat - Math.floor(beat);
            const energy = 0.5 + 0.4 * Math.sin(T * 0.5);

            gl.uniform1f(U.uTime, T);
            gl.uniform1f(U.uClipTime, T);
            gl.uniform1f(U.uProgress, Math.min(T / 5, 1));
            gl.uniform1f(U.uGlobalTime, T);
            gl.uniform2f(U.uResolution, canvas.width, canvas.height);
            gl.uniform1i(U.uSeed, test.uSeed);
            gl.uniform1f(U.uBeat, beat);
            gl.uniform1f(U.uBeatPhase, beatPhase);
            gl.uniform1f(U.uBarPhase, (beat / 4) - Math.floor(beat / 4));
            gl.uniform1f(U.uEnergy, energy);
            gl.uniform3fv(U.uPrimaryColor, test.uPrimaryColor);
            gl.uniform3fv(U.uAccentColor, test.uAccentColor);
            gl.uniform1f(U.uIntensity, energy);                    // bind: energy
            gl.uniform1f(U.uMotionSpeed, 0.8 + energy * 0.8);     // bind: 0.8 + energy*0.8
            gl.uniform1f(U.uWarmth, 0.5);                          // bind: temperature/4 (0.5 по умолчанию)

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            frameCount++;
            if (frameCount % 15 === 0) {
                setHud('ok', '✅ anxiety_mist  |  T=' + T.toFixed(1) + 's' +
                       '  |  intensity=' + energy.toFixed(2) +
                       '  |  motion=' + (0.8 + energy * 0.8).toFixed(2) +
                       '  |  beatFlash=' + Math.pow(1 - beatPhase, 6).toFixed(2) +
                       '  |  FPS=' + fpsSmooth.toFixed(0) +
                       '  |  res=' + canvas.width + 'x' + canvas.height);
            }
            requestAnimationFrame(frame);
        }
        push('step 8: starting render loop…');
        frame();
    } catch (e) {
        const errMsg = e && e.message ? e.message : String(e);
        const shaderInfo = lastShaderError ? '\n\nLast shader error:\n' + lastShaderError : '';
        setHud('err', 'EXCEPTION: ' + errMsg + shaderInfo + '\n\nLog:\n' + log.join('\n'));
        console.error(e);
    }
})();
</script>
</body>
</html>
