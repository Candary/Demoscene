<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>flash.frag — preview</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud {
    position: absolute; top: 8px; left: 8px;
    color: #6f6; font: 12px monospace;
    background: rgba(0,0,0,0.85); padding: 8px 12px; border-radius: 4px;
    max-width: 95vw; white-space: pre-wrap;
  }
  .hud.err { color: #f66; }
  .hud.ok  { color: #6f6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud">init…</div>

<!-- Hidden canvases for procedural textures A and B -->
<canvas id="texA" width="512" height="512" style="display:none"></canvas>
<canvas id="texB" width="512" height="512" style="display:none"></canvas>

<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;

out vec4 FragColor;

uniform float uTime;
uniform float uClipTime;
uniform float uProgress;
uniform float uGlobalTime;
uniform vec2  uResolution;
uniform int   uSeed;
uniform float uBeat;
uniform float uBeatPhase;
uniform float uBarPhase;
uniform float uEnergy;

uniform vec3  uColor;
uniform float uPeak;

uniform sampler2D uA;
uniform sampler2D uB;

void main() {
    vec2 uv = gl_FragCoord.xy / uResolution;

    vec4 a = texture(uA, uv);
    vec4 b = texture(uB, uv);

    float p = uProgress;

    // A fade-out в первой половине, B fade-in во второй.
    float mixA = 1.0 - smoothstep(0.0, 0.5, p);
    float mixB = smoothstep(0.5, 1.0, p);

    // Flash intensity — пик в центре (progress = 0.5).
    float flashIntensity = uPeak * pow(max(0.0, sin(p * 3.14159265359)), 4.0);

    vec3 col = a.rgb * mixA + b.rgb * mixB + uColor * flashIntensity;
    float alpha = max(max(mixA, mixB), min(flashIntensity, 1.0));

    FragColor = vec4(col, alpha);
}
</script>

<script>
(function () {
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const log = [];
    function setHud(cls, msg) { hud.className = 'hud ' + cls; hud.textContent = msg; }
    function push(msg) { log.push(msg); setHud('', log.join('\n')); }

    // --- Создание процедурных текстур A и B через canvas2d ---
    function makeTextureA() {
        const c = document.getElementById('texA');
        const ctx = c.getContext('2d');
        // A: red-to-blue diagonal gradient + circle
        const g = ctx.createLinearGradient(0, 0, 512, 512);
        g.addColorStop(0, '#ff3030');
        g.addColorStop(1, '#3030ff');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 512, 512);
        // Круг для различимости
        ctx.fillStyle = '#ffff80';
        ctx.beginPath();
        ctx.arc(256, 256, 80, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('A', 256, 270);
        return c;
    }

    function makeTextureB() {
        const c = document.getElementById('texB');
        const ctx = c.getContext('2d');
        // B: green-to-purple diagonal gradient + square
        const g = ctx.createLinearGradient(0, 0, 512, 512);
        g.addColorStop(0, '#30ff30');
        g.addColorStop(1, '#ff30ff');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 512, 512);
        // Квадрат для различимости
        ctx.fillStyle = '#80ffff';
        ctx.fillRect(176, 176, 160, 160);
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('B', 256, 270);
        return c;
    }

    try {
        push('step 1: get webgl2 context…');
        const gl = canvas.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
        if (!gl) { setHud('err', 'ERROR: WebGL2 не поддерживается.'); return; }
        push('step 2: ' + gl.getParameter(gl.VERSION));
        push('step 3: renderer=' + gl.getParameter(gl.RENDERER).substring(0, 60));

        let lastShaderError = '';
        function compile(type, src, name) {
            const sh = gl.createShader(type);
            gl.shaderSource(sh, src.trim());
            gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
                lastShaderError = gl.getShaderInfoLog(sh) || '(empty info log)';
                return null;
            }
            return sh;
        }

        const vsSrc = document.getElementById('vs').textContent;
        const fsSrc = document.getElementById('fs').textContent;
        push('step 4: compile vertex shader (' + vsSrc.length + ' bytes)…');
        const vs = compile(gl.VERTEX_SHADER, vsSrc, 'vertex');
        if (!vs) {
            setHud('err', 'VERTEX SHADER COMPILE FAILED:\n' + lastShaderError + '\n\nLog:\n' + log.join('\n'));
            return;
        }
        push('step 5: compile fragment shader (' + fsSrc.length + ' bytes)…');
        const fs = compile(gl.FRAGMENT_SHADER, fsSrc, 'fragment');
        if (!fs) {
            setHud('err', 'FRAGMENT SHADER COMPILE FAILED:\n' + lastShaderError + '\n\nLog:\n' + log.join('\n'));
            return;
        }

        push('step 6: link program…');
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
            setHud('err', 'LINK ERROR:\n' + gl.getProgramInfoLog(prog));
            return;
        }
        gl.useProgram(prog);
        push('step 7: program linked OK');

        // Fullscreen quad
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(prog, 'aPos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        // --- Создать процедурные текстуры ---
        push('step 7.5: create procedural textures A and B…');
        const canvasA = makeTextureA();
        const canvasB = makeTextureB();

        function uploadTexture(canvasElement, unit) {
            const tex = gl.createTexture();
            gl.activeTexture(gl.TEXTURE0 + unit);
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvasElement);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            return tex;
        }
        const texA = uploadTexture(canvasA, 0);
        const texB = uploadTexture(canvasB, 1);

        // Uniform locations
        const U = {};
        ['uTime','uClipTime','uProgress','uGlobalTime','uResolution','uSeed',
         'uBeat','uBeatPhase','uBarPhase','uEnergy','uColor','uPeak','uA','uB']
            .forEach(name => U[name] = gl.getUniformLocation(prog, name));

        // Установить sampler uniforms один раз
        gl.uniform1i(U.uA, 0);  // texture unit 0
        gl.uniform1i(U.uB, 1);  // texture unit 1

        const test = {
            uColor: [1.0, 1.0, 1.0],  // white flash (default)
            uPeak: 1.2,
            uSeed: 2026,
            // uProgress будет меняться 0..1 в цикле
        };

        function resize() {
            const dpr = 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        // Cycle period: 4 секунды на полный переход (2с flash up + 2с flash down)
        const CYCLE_SECONDS = 4.0;

        const start = performance.now();
        let lastFrameT = 0, frameCount = 0, fpsSmooth = 0;
        function frame() {
            const T = (performance.now() - start) / 1000;
            const dt = lastFrameT > 0 ? (T - lastFrameT) : 0.016;
            lastFrameT = T;
            const instantFps = 1.0 / dt;
            fpsSmooth = fpsSmooth > 0 ? fpsSmooth * 0.9 + instantFps * 0.1 : instantFps;

            // Циклический progress 0..1 — анимация перехода
            const progress = (T % CYCLE_SECONDS) / CYCLE_SECONDS;

            const beat = T * 2.0;
            const beatPhase = beat - Math.floor(beat);

            gl.uniform1f(U.uTime, T);
            gl.uniform1f(U.uClipTime, T);
            gl.uniform1f(U.uProgress, progress);
            gl.uniform1f(U.uGlobalTime, T);
            gl.uniform2f(U.uResolution, canvas.width, canvas.height);
            gl.uniform1i(U.uSeed, test.uSeed);
            gl.uniform1f(U.uBeat, beat);
            gl.uniform1f(U.uBeatPhase, beatPhase);
            gl.uniform1f(U.uBarPhase, (beat / 4) - Math.floor(beat / 4));
            gl.uniform1f(U.uEnergy, 0.5);
            gl.uniform3fv(U.uColor, test.uColor);
            gl.uniform1f(U.uPeak, test.uPeak);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            frameCount++;
            if (frameCount % 15 === 0) {
                setHud('ok', '✅ flash transition  |  T=' + T.toFixed(1) + 's' +
                       '  |  progress=' + progress.toFixed(2) +
                       '  |  peak=' + test.uPeak.toFixed(2) +
                       '  |  color=(' + test.uColor[0].toFixed(1) + ',' +
                                            test.uColor[1].toFixed(1) + ',' +
                                            test.uColor[2].toFixed(1) + ')' +
                       '  |  FPS=' + fpsSmooth.toFixed(0) +
                       '  |  res=' + canvas.width + 'x' + canvas.height +
                       '  |  cycle=' + CYCLE_SECONDS + 's');
            }
            requestAnimationFrame(frame);
        }
        push('step 8: starting render loop (cycle=' + CYCLE_SECONDS + 's, A->flash->B->flash->A…)…');
        frame();
    } catch (e) {
        const errMsg = e && e.message ? e.message : String(e);
        const shaderInfo = lastShaderError ? '\n\nLast shader error:\n' + lastShaderError : '';
        setHud('err', 'EXCEPTION: ' + errMsg + shaderInfo + '\n\nLog:\n' + log.join('\n'));
        console.error(e);
    }
})();
</script>
</body>
</html>
